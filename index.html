<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor CCTV Sukabumi</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; background: #333; color: white; }
        .video-box { background: #111; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <h1>🔴 LIVE CCTV KAB. SUKABUMI</h1>
    
    <select id="pilihKamera" onchange="putarVideo()">
        <option value="">-- Pilih Lokasi CCTV --</option>
        <option value="/hls/exittol/stream.m3u8">Exit Tol</option>
        <option value="/hls/pasarcibadak/stream.m3u8">Pasar Cibadak</option>
        <option value="/hls/masjidcibadak/stream.m3u8">Masjid Cibadak</option>
        <option value="/hls/cikembang/stream.m3u8">Cikembang</option>
        <option value="/hls/cisaat/stream.m3u8">Cisaat</option>
        <option value="/hls/sukaraja/stream.m3u8">Sukaraja</option>
    </select>

    <div class="video-box">
        <video id="my-player" class="video-js vjs-default-skin vjs-16-9" controls preload="auto"></video>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-player');

        function putarVideo() {
            var path = document.getElementById("pilihKamera").value;
            if (path) {
                // MENGGUNAKAN PROXY UNTUK MENEMBUS BLOKIR (CORS)
                var domainAsli = "https://cctv-dishub.sukabumikab.go.id" + path;
                var urlProxy = "https://corsproxy.io/?" + encodeURIComponent(domainAsli);
                
                player.src({
                    src: urlProxy,
                    type: 'application/x-mpegURL'
                });
                player.play();
            }
        }
    </script>
</body>
</html>
